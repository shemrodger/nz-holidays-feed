name: Update holiday feed

# Three jobs, each with only the access it needs:
#   build   - read-only. Installs the two holiday packages, runs the tests and builds the files.
#   publish - can write to the repo, but runs only our own standard-library code. Checks the files, then commits.
#   alert   - can only open issues. Runs when build or publish fails.
# Third-party package code never runs in a job that can change the repo.
# Each action is pinned to an exact commit, so a moved tag upstream cannot change what runs.

on:
  schedule:
    - cron: "0 20 1 * *"   # 20:00 UTC on the 1st = the morning of the 2nd in New Zealand
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install the two holiday packages (latest within the major version)
        run: |
          pip install -r requirements.txt
          npm install --no-audit --no-fund

      - name: Run the tests
        run: python -m unittest discover -s tests -v

      - name: Build and check the feed
        run: python tools/update.py

      - name: Hand the files to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: feed
          path: |
            */NZ.json
            README.md
            years.json
          if-no-files-found: error

      - name: Keep the report for the alert
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: report
          path: report.md
          if-no-files-found: ignore

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: feed
          path: .

      - name: Check the files (standard library only)
        run: python3 tools/validate_feed.py .

      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*/NZ.json' README.md years.json
          git diff --cached --quiet || (git commit -m "Update holiday feed" && git push)

  alert:
    needs: [build, publish]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        continue-on-error: true
        with:
          name: report
          path: .

      - name: Open an issue (one at a time)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          open=$(gh issue list --repo "$REPO" --label feed-alert --state open --json number --jq 'length')
          if [ "$open" = "0" ]; then
            gh label create feed-alert --repo "$REPO" --color B60205 --description "The holiday feed job needs a person" --force
            if [ -f report.md ]; then body=$(cat report.md); else body="The job failed before or after the checks. Nothing was published."; fi
            body="$body"$'\n\n'"Run log: $GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"
            gh issue create --repo "$REPO" --title "Holiday feed check failed" --label feed-alert --body "$body"
          fi
